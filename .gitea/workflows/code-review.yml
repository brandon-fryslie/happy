name: AI Code Review

# First live proof of copirate-code-review-agent on Gitea (home-copirate-review-9uj.7),
# replacing pr-agent as the reviewer for this repo. The action's gitea transport is
# capability-detected in src/transport.js — no action code changes needed here, only
# wiring: the mirrored action, the two Actions secrets from .3/.4, a checkout so the
# engine can explore the tree, and a per-PR concurrency group so a rapid push loop
# doesn't pay for reviews of commits that are already replaced.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write   # the cost ledger is a repo issue the action reads and appends to (9uj.8)

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # Full URL: bare `uses:` names resolve against the instance default actions
      # host, not this instance's own mirror (home-ci-workflows 2g4.5).
      - name: Checkout
        uses: https://github.com/actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: CoPirate Code Review
        uses: https://gitea.sanctuary.gdn/brandon-fryslie/copirate-code-review-agent@v1
        with:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # [LAW:one-source-of-truth] copirate-bot's own token, not the workflow's
          # default GITHUB_TOKEN — only a distinct bot identity can APPROVE (Gitea
          # rejects a PR author's own token approving its own pull), verified live
          # in home-copirate-review-9uj.4 (PR #127).
          GITHUB_REVIEW_TOKEN: ${{ secrets.COPIRATE_REVIEW_TOKEN }}
          # Cost controls at dozens of reviews/day (home-copirate-review-9uj.8): difficulty
          # right-sizes effort per diff; the budget gradient rations spend against the ledger
          # issue (terraform/gitea's LEDGER_ISSUE variable → issue #135). $10/day is an opening
          # ceiling — retune once a week of ledger data shows actual spend.
          DIFFICULTY_SCALING: "true"
          DAILY_BUDGET_USD: "10"
          LEDGER_ISSUE: ${{ vars.LEDGER_ISSUE }}
