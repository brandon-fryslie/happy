name: Build and Deploy Happy Server

# Builds the happy-server Docker image and deploys to the homelab.
#
# - Push to main: builds :latest + :<sha>, deploys to prod (happy.sanctuary.gdn)
# - Pull request: builds :test + :pr-<number>, deploys to test (happy-test.sanctuary.gdn)
# - Manual dispatch: builds from specified ref, deploys to chosen target
#
# Runs on the self-hosted Gitea act-runner which has docker.sock mounted,
# so builds hit the runner VM's daemon directly (trusts 192.168.7.208:5000
# via insecure-registries in modules/docker/default.nix).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target: prod or test"
        required: false
        default: "prod"

env:
  REGISTRY: 192.168.7.208:5000
  IMAGE: happy-server
  NOMAD_ADDR: http://192.168.7.217:4646
  NOMAD_VERSION: "1.8.4"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine build target
        id: target
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          if [ "${{ gitea.event_name }}" = "pull_request" ]; then
            echo "env=test" >> "$GITHUB_OUTPUT"
            echo "tag=test" >> "$GITHUB_OUTPUT"
            echo "extra_tag=pr-${{ gitea.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "nomad_job=happy-test" >> "$GITHUB_OUTPUT"
          elif [ "${{ gitea.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.target }}" = "test" ]; then
            echo "env=test" >> "$GITHUB_OUTPUT"
            echo "tag=test" >> "$GITHUB_OUTPUT"
            echo "extra_tag=$SHA" >> "$GITHUB_OUTPUT"
            echo "nomad_job=happy-test" >> "$GITHUB_OUTPUT"
          else
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "extra_tag=$SHA" >> "$GITHUB_OUTPUT"
            echo "nomad_job=happy" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        env:
          SHA: ${{ steps.target.outputs.sha }}
          TAG: ${{ steps.target.outputs.tag }}
          EXTRA_TAG: ${{ steps.target.outputs.extra_tag }}
        run: |
          set -euo pipefail
          docker build \
            --tag "$REGISTRY/$IMAGE:$TAG" \
            --tag "$REGISTRY/$IMAGE:$EXTRA_TAG" \
            .

      - name: Push image
        env:
          TAG: ${{ steps.target.outputs.tag }}
          EXTRA_TAG: ${{ steps.target.outputs.extra_tag }}
        run: |
          set -euo pipefail
          docker push "$REGISTRY/$IMAGE:$TAG"
          docker push "$REGISTRY/$IMAGE:$EXTRA_TAG"
          echo "Pushed $REGISTRY/$IMAGE:$TAG and :$EXTRA_TAG"

      - name: Install nomad CLI
        run: |
          set -euo pipefail
          curl -fsSL "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip" -o /tmp/nomad.zip
          unzip -o /tmp/nomad.zip -d /usr/local/bin/
          chmod +x /usr/local/bin/nomad
          nomad version

      - name: Clone home-infra for job specs
        run: |
          set -euo pipefail
          git clone --depth 1 https://gitea.sanctuary.gdn/brandon-fryslie/homelab-infra.git /tmp/home-infra

      - name: Deploy
        env:
          JOB: ${{ steps.target.outputs.nomad_job }}
          ENV: ${{ steps.target.outputs.env }}
        run: |
          set -euo pipefail
          JOB_FILE="/tmp/home-infra/jobs/happy-server.nomad.hcl"
          if [ "$ENV" = "test" ]; then
            JOB_FILE="/tmp/home-infra/jobs/happy-server-test.nomad.hcl"
          fi
          nomad job run "$JOB_FILE"
          # force_pull=true only applies to new allocations. If the job spec
          # hasn't changed, `nomad job run` is a no-op. Restart the allocation
          # to force a pull of the new image.
          nomad job restart -yes "$JOB"
          echo "Deployed $JOB from $JOB_FILE"
